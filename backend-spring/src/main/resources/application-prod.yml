# ====================================================================
# PROFIL : PROD (PostgreSQL / Cloud Docker / Déploiement Entreprise)
# ====================================================================
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/emsi_academic_prod}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql

app:
  jwt:
    secret: ${JWT_SECRET:EMSI_UNIVORA_ACADEMIC_SECURITY_SUPER_SECRET_KEY_2026_HMAC_SHA256_SECURED}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
