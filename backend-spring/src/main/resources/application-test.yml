# ====================================================================
# PROFIL : TEST (H2 In-Memory - Tests unitaires & intégration ultra-rapides)
# ====================================================================
spring:
  datasource:
    url: jdbc:h2:mem:emsi_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: EMSI_TEST_SECURITY_SECRET_KEY_FOR_UNIT_TESTING_2026_HMAC_SHA256_32_CHARS
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
