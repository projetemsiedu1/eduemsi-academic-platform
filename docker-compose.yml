# Local development stack. Set the required secrets in an untracked .env file.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: emsi_academic_db
      MYSQL_USER: emsi_app
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --user=emsi_app --execute='SELECT 1' emsi_academic_db"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [emsi]
  backend:
    build: ./backend-spring
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/emsi_academic_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: emsi_app
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in .env}
      APP_JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in .env (at least 64 bytes)}
      APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SERVER_PORT: 8085
    ports: ["8085:8085"]
    networks: [emsi]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8085/api/v1}
    depends_on: [backend]
    ports: ["3000:3000"]
    networks: [emsi]
volumes:
  mysql_data:
networks:
  emsi:
